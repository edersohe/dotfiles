add_newline = false
palette = 'noctalia'

[aws]
style = "bold orange"

[character]
error_symbol = "[λ](bold red)"
success_symbol = "[λ](bold green)"

[cmd_duration]
style = "bold yellow"

[directory]
style = "bold green"

[git_branch]
style = "bold pink"

[git_status]
style = "bold red"

[hostname]
style = "bold purple"

[username]
format = "[$user]($style) on "
style_user = "bold cyan"

[palettes.noctalia]
# Standard colors
blue      = "#a9aefe"
red       = "#fd4663"
green     = "#9bfece"
yellow    = "#fff59b"
cyan      = "#9bfece"
magenta   = "#fd4663"
white     = "#f3edf7"
black     = "#11112d"

# Extended palette (Catppuccin-compatible names)
rosewater = "#fff59b"
flamingo  = "#fd4663"
pink      = "#fd4663"
mauve     = "#fd4663"
maroon    = "#fd4663"
peach     = "#fff59b"
teal      = "#9bfece"
sky       = "#9bfece"
sapphire  = "#a9aefe"
lavender  = "#fd4663"

# Text shades
text      = "#f3edf7"
subtext1  = "#f3edf7"
subtext0  = "#21215f"

# Surface shades
overlay2  = "#21215f"
overlay1  = "#21215f"
overlay0  = "#11112d"
surface2  = "#11112d"
surface1  = "#11112d"
surface0  = "#070722"
base      = "#070722"
mantle    = "#070722"
crust     = "#070722"
